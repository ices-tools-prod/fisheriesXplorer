name: Deploy fisheriesXplorer (shinyapps.io)

on:
  push:
    branches:
      - development
      - release

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: ${{ github.ref_name == 'release' && 'prod' || 'dev' }}

    env:
      CI: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      RENV_CONFIG_REPOS_OVERRIDE: "ICES=https://ices-tools-prod.r-universe.dev;CRAN=https://cloud.r-project.org"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2
      

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libabsl-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libcairo2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libudunits2-dev \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libgit2-dev \
            libglpk-dev \
            libnode-dev
      
      - name: Install deploy tools
        run: Rscript -e 'install.packages(c("rsconnect","desc","pkgload", "processx"), repos = "https://cloud.r-project.org")'

      - name: Restore renv packages
        uses: r-lib/actions/setup-renv@v2

      - name: Check renv status
        run: Rscript -e 'renv::status()'

      - name: Deploy fisheriesXplorer
        run: Rscript scripts/deploy_shinyapps.R