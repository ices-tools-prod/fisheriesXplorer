name: Deploy fisheriesXplorer (shinyapps.io)

on:
  push:
    branches:
      - development
      - release

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'release' && 'prod' || 'dev' }}

    env:
      CI: "true"
      SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libsqlite3-dev \
            libgit2-dev \
            libglpk-dev \
            libnode-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libcairo2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff5-dev \
            libudunits2-dev \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            make \
            g++

      - name: Install renv
        run: |
          Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'

      - name: Restore renv environment
        env:
          RENV_CONFIG_REPOS_OVERRIDE: >-
            CRAN=https://cloud.r-project.org;
            icestoolsprod=https://ices-tools-prod.r-universe.dev;
            fishfollower=https://fishfollower.r-universe.dev;
            flr=https://flr.r-universe.dev;
            stox=https://stoxproject.github.io/repo
        run: |
          Rscript -e 'options(repos = c(
            CRAN = "https://cloud.r-project.org",
            icestoolsprod = "https://ices-tools-prod.r-universe.dev",
            fishfollower = "https://fishfollower.r-universe.dev",
            flr = "https://flr.r-universe.dev",
            stox = "https://stoxproject.github.io/repo"
          ))'
          Rscript -e 'print(getOption("repos"))'
          Rscript -e 'renv::consent(provided = TRUE)'
          Rscript -e 'renv::restore(prompt = FALSE, repos = getOption("repos"))'

      - name: Install deploy dependencies
        run: |
          Rscript -e 'install.packages(c("rsconnect","desc"), repos = "https://cloud.r-project.org")'

      - name: Deploy fisheriesXplorer
        run: Rscript scripts/deploy_shinyapps.R